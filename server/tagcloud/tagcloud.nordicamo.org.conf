# nginx site for tagcloud.nordicamo.org: static files, served directly.
# Installed by server/tagcloud/setup_once.sh; certbot then adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tagcloud.nordicamo.org;

    root /var/www/nordicamo-tagcloud;
    index index.html;

    # The page never sends text anywhere; these headers enforce that.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Nothing but the page, its assets and the favicon is published.
    location ~ /\.|/tests/|package\.json|README\.md { return 404; }
}
